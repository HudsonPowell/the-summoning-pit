<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rig — the void</title>
  <style>
    :root {
      --bg: #05060a; --panel: #0d0f16; --line: #1e212b;
      --ink: #c8cdd6; --dim: #6b7280; --accent: #3aa7a0;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--ink);
      font: 12px/1.5 'SF Mono', ui-monospace, Menlo, monospace;
    }
    #shell { position: relative; width: 100%; height: 100%; }
    /* the viewport fills everything — the figure lives in the whole screen */
    #view {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      display: block;
      background: var(--bg);
    }
    /* chrome floats over it and gets out of the way for a clean grab */
    #chrome {
      position: absolute; inset: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #shell.bare #chrome { opacity: 0; }
    #title {
      position: absolute; top: 18px; left: 22px;
      letter-spacing: 0.36em; font-weight: 600; color: var(--ink);
      text-shadow: 0 1px 8px #000;
    }
    #title small {
      display: block; letter-spacing: 0.12em; font-weight: 400;
      color: var(--dim); font-size: 10px; margin-top: 3px;
    }
    #cast {
      position: absolute; bottom: 18px; left: 22px;
      color: var(--dim); font-size: 11px; letter-spacing: 0.1em;
      text-shadow: 0 1px 8px #000;
    }
    #hint {
      position: absolute; bottom: 18px; right: 22px;
      color: #40454f; font-size: 10px; letter-spacing: 0.08em;
    }
    #toggle {
      position: absolute; top: 14px; right: 16px; pointer-events: auto;
      background: rgba(13,15,22,0.7); border: 1px solid var(--line); color: var(--dim);
      font: inherit; font-size: 11px; padding: 5px 12px; cursor: pointer;
      border-radius: 4px; backdrop-filter: blur(6px);
    }
    #toggle:hover { color: var(--accent); border-color: var(--accent); }
    /* the fiddling drawer, off to the side and out of the picture */
    #panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 268px;
      background: rgba(13,15,22,0.92); border-left: 1px solid var(--line);
      backdrop-filter: blur(10px);
      padding: 48px 16px 24px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1);
      pointer-events: auto;
    }
    #shell.panel-open #panel { transform: none; }
    #panel h2 {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--dim); font-weight: 600; margin: 16px 0 6px;
      border-bottom: 1px solid var(--line); padding-bottom: 4px;
    }
    #panel h2:first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 74px 1fr 34px; gap: 8px; align-items: center; padding: 1px 0; }
    .row span { font-size: 10px; color: var(--ink); }
    .row em { font-style: normal; font-size: 10px; color: var(--dim); text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 12px; }
    input[type=checkbox] { accent-color: var(--accent); }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .btns button {
      background: none; border: 1px solid var(--accent); color: var(--accent);
      font: inherit; font-size: 11px; padding: 4px 12px; cursor: pointer; border-radius: 3px;
    }
    .btns button:hover { background: var(--accent); color: #05060a; }
    #nav {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 14px; pointer-events: auto;
    }
    #nav a { color: #444a56; text-decoration: none; font-size: 10px; letter-spacing: 0.14em; }
    #nav a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div id="shell">
    <canvas id="view"></canvas>
    <div id="chrome">
      <div id="title">THE VOID<small>nobody is playing</small></div>
      <div id="nav">
        <a href="/">FORGE</a>
        <a href="/bestiary.html">BESTIARY</a>
        <a href="/clash.html">ARENA</a>
      </div>
      <button id="toggle">controls</button>
      <div id="cast"></div>
      <div id="hint">c hide chrome · h controls · p capture</div>
      <div id="panel"></div>
    </div>
  </div>
  <script type="module" src="/src/void/main.ts"></script>
</body>
</html>
