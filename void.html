<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rig — the void</title>
  <style>
    :root {
      --panel: #0d0f16; --line: #1e212b;
      --ink: #c8cdd6; --dim: #6b7280; --accent: #3aa7a0;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    body { font: 12px/1.5 'SF Mono', ui-monospace, Menlo, monospace; color: var(--ink); }
    /* the stage is only ever what you can actually see — never under the drawer */
    #shell { position: relative; width: 100%; height: 100%; display: flex; }
    #stage { position: relative; flex: 1; min-width: 0; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    /* the drawer sits beside the stage, never over it */
    #panel {
      width: 0; flex: 0 0 auto; overflow: hidden;
      background: var(--panel); border-left: 1px solid transparent;
    }
    #shell.open #panel { width: 272px; border-left-color: var(--line); }
    #panelInner { width: 272px; height: 100%; overflow-y: auto; padding: 18px 16px 28px; }
    #panel h2 {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--dim); font-weight: 600; margin: 15px 0 6px;
      border-bottom: 1px solid var(--line); padding-bottom: 4px;
    }
    #panel h2:first-child { margin-top: 0; }
    .summon { margin: 0 0 14px; }
    .summon input {
      width: 100%; box-sizing: border-box; padding: 9px 10px;
      background: #0d1014; border: 1px solid #2a3138; border-radius: 3px;
      color: #d8e0ea; font: inherit; font-size: 12px; letter-spacing: .04em;
    }
    .summon input:focus { outline: none; border-color: #4bb3a6; }
    .summon input::placeholder { color: #4a545e; }
    .summonStatus { margin-top: 5px; min-height: 12px; font-size: 10px; color: var(--dim); letter-spacing: .04em; }
    .row { display: grid; grid-template-columns: 76px 1fr 32px; gap: 8px; align-items: center; padding: 1px 0; }
    .row span { font-size: 10px; color: var(--ink); }
    .row em { font-style: normal; font-size: 10px; color: var(--dim); text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 12px; }
    input[type=checkbox] { accent-color: var(--accent); }
    input[type=color] {
      width: 100%; height: 17px; padding: 0; cursor: pointer;
      border: 1px solid #2c2f3a; border-radius: 3px; background: none;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .btns button {
      background: none; border: 1px solid var(--accent); color: var(--accent);
      font: inherit; font-size: 11px; padding: 4px 12px; cursor: pointer; border-radius: 3px;
    }
    .btns button:hover { background: var(--accent); color: #05060a; }
    #feedwrap { margin-top: 18px; }
    #feed {
      font-size: 10px; line-height: 1.5; color: var(--dim);
      max-height: 200px; overflow: hidden;
    }
    #links { margin-top: 16px; display: flex; gap: 12px; }
    #links a { color: #444a56; text-decoration: none; font-size: 10px; letter-spacing: 0.12em; }
    #links a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div id="shell">
    <div id="stage"><canvas id="view"></canvas></div>
    <aside id="panel"><div id="panelInner"></div></aside>
  </div>
  <script type="module" src="/src/void/main.ts"></script>
</body>
</html>
