<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- maximum-scale=1: without it iOS pinches the PAGE, not the pit, and the
       game's own pinch handler never hears a thing -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>The Summoning Pit</title>
  <meta name="description" content="One pit, all of us. Summon. Pit lord survives." />
  <meta property="og:title" content="The Summoning Pit" />
  <meta property="og:description" content="One pit, all of us. Summon. Pit lord survives." />
  <meta property="og:image" content="https://pit-production-4fae.up.railway.app/og.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Unica One: the nearest OPEN cousin of Modula Sans (which is licensed
       Emigre and stays first in the stack for whenever a licence lands) -->
  <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel: #0d0f16; --line: #1e212b;
      --ink: #c8cdd6; --dim: #6b7280; --accent: #3aa7a0;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    body { font: 12px/1.5 'SF Mono', ui-monospace, Menlo, monospace; color: var(--ink); }
    /* the stage is only ever what you can actually see — never under the drawer */
    #shell { position: relative; width: 100%; height: 100%; display: flex; }
    #stage { position: relative; flex: 1; min-width: 0; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    /* the drawer sits beside the stage, never over it */
    #panel {
      width: 0; flex: 0 0 auto; overflow: hidden;
      background: var(--panel); border-left: 1px solid transparent;
    }
    #shell.open #panel { width: 272px; border-left-color: var(--line); }
    #panelInner { width: 272px; height: 100%; overflow-y: auto; padding: 18px 16px 28px; }
    #panel h2 {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--dim); font-weight: 600; margin: 15px 0 6px;
      border-bottom: 1px solid var(--line); padding-bottom: 4px;
    }
    #panel h2:first-child { margin-top: 0; }
    html, body { overscroll-behavior: none; }
    body { position: fixed; inset: 0; overflow: hidden; }
    #stage { position: relative; touch-action: none; -webkit-user-select: none; user-select: none; }
    #stage canvas#view { touch-action: none; }
    #buildTag {
      position: absolute; bottom: 8px; right: 10px; z-index: 6;
      font-size: 9px; letter-spacing: .08em; color: #3d434b;
      user-select: none; pointer-events: none;
    }
    #watchTag {
      position: absolute; bottom: 8px; left: 10px; z-index: 6;
      font-size: 9px; letter-spacing: .08em; color: #4a525b;
      user-select: none; pointer-events: none;
    }
    /* the status line is a button now: tap it with a hero standing and your
       pact link is on the clipboard */
    #summonStatus { cursor: pointer; }
    #muteIcon {
      position: absolute; top: 16px; right: 16px; z-index: 6;
      width: 46px; height: 46px; cursor: pointer;
      opacity: .5; transition: opacity .18s;
      image-rendering: pixelated;
    }
    #muteIcon:hover { opacity: 1; }
    #summonBar {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      width: min(520px, 74%); z-index: 5;
    }
    /* The TDK pill, pushed toward the pit's own look: the GLASS lives on a
       ::before layer that is itself blurred, so its edge feathers into the
       dark like every other blob in the field — no card, no rim. The input
       on top stays crisp for the text. */
    #summonBar::before {
      /* the glass covers the INPUT only — inset:0 spanned the whole bar,
         status line included, and read as a too-tall pill with high text */
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 48px;
      background: rgba(58, 60, 63, .48);
      backdrop-filter: blur(34px); -webkit-backdrop-filter: blur(34px);
      border-radius: 22px;
      filter: blur(5px);
      transition: background .25s;
      pointer-events: none;
    }
    #summonBar:focus-within::before { background: rgba(72, 74, 78, .55); }
    #summonBar:has(input:disabled)::before { background: rgba(58, 60, 63, .26); }
    /* Modula Sans, when its files land in public/fonts/ — until then the
       stack falls through to Helvetica and nothing breaks */
    @font-face {
      font-family: 'Modula Sans';
      src: url('/fonts/ModulaSans.woff2') format('woff2'),
           url('/fonts/ModulaSans.woff') format('woff'),
           url('/fonts/ModulaSans.otf') format('opentype');
      font-weight: 400 500;
      font-display: swap;
    }
    #summonBar input {
      position: relative;
      width: 100%; box-sizing: border-box; height: 48px; padding: 5px 19px;
      background: none;
      border: none; border-radius: 22px;
      text-align: center;
      color: #f2f2f2;
      font-family: "Modula Sans", "Unica One", "Helvetica Neue", Helvetica, Arial, sans-serif;
      /* 16px: anything smaller and iOS zooms the page every time the field is
         focused, which is most of what made the keyboard feel broken */
      font-size: 16px; font-weight: 500; letter-spacing: .03em;
      transition: background .25s, opacity .3s;
    }
    /* the field IS the state: dim and untouchable while a hero is in play */
    #summonBar input:disabled { opacity: .45; cursor: default; }
    #summonStatus.lord { color: #b8975a; letter-spacing: .18em; }
    #summonBar input:focus { outline: none; }
    #summonBar input::placeholder { color: #8a8a8a; }
    #summonStatus {
      margin-top: 6px; min-height: 12px; text-align: center;
      font-size: 10px; color: #6f7b86; letter-spacing: .09em;
      text-transform: uppercase;
    }
    .summon { margin: 0 0 14px; }
    .summon input {
      width: 100%; box-sizing: border-box; padding: 9px 10px;
      background: #0d1014; border: 1px solid #2a3138; border-radius: 3px;
      color: #d8e0ea; font: inherit; font-size: 12px; letter-spacing: .04em;
    }
    .summon input:focus { outline: none; border-color: #4bb3a6; }
    .summon input::placeholder { color: #4a545e; }
    .summonStatus { margin-top: 5px; min-height: 12px; font-size: 10px; color: var(--dim); letter-spacing: .04em; }
    .row { display: grid; grid-template-columns: 76px 1fr 32px; gap: 8px; align-items: center; padding: 1px 0; }
    .row span { font-size: 10px; color: var(--ink); }
    .row em { font-style: normal; font-size: 10px; color: var(--dim); text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 12px; }
    input[type=checkbox] { accent-color: var(--accent); }
    input[type=color] {
      width: 100%; height: 17px; padding: 0; cursor: pointer;
      border: 1px solid #2c2f3a; border-radius: 3px; background: none;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .btns button {
      background: none; border: 1px solid var(--accent); color: var(--accent);
      font: inherit; font-size: 11px; padding: 4px 12px; cursor: pointer; border-radius: 3px;
    }
    .btns button:hover { background: var(--accent); color: #05060a; }
    #feedwrap { margin-top: 18px; }
    #feed {
      font-size: 10px; line-height: 1.5; color: var(--dim);
      max-height: 200px; overflow: hidden;
    }
    #links { margin-top: 16px; display: flex; gap: 12px; }
    #links a { color: #444a56; text-decoration: none; font-size: 10px; letter-spacing: 0.12em; }
    #links a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div id="shell">
    <div id="stage">
      <canvas id="view"></canvas>
      <canvas id="muteIcon" title="sound"></canvas>
      <div id="buildTag"></div>
    <div id="watchTag"></div>
      <div id="summonBar"><input id="summonBox" type="text" placeholder="summon…" autocomplete="off" spellcheck="false"><div id="summonStatus"></div></div>
    </div>
    <aside id="panel"><div id="panelInner"></div></aside>
  </div>
  <script type="module" src="/src/void/main.ts"></script>
</body>
</html>
