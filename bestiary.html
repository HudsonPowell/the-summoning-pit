<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Summoning Pit — bestiary</title>
  <style>
    :root {
      --bg: #0b0c10; --panel: #14161c; --line: #23252e;
      --ink: #c8cdd6; --dim: #6b7280; --accent: #3aa7a0; --warn: #d5573b;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink);
      font: 13px/1.5 'SF Mono', ui-monospace, Menlo, monospace;
      display: flex; height: 100vh; overflow: hidden;
    }
    #nav {
      width: 74px; background: #0d0f14; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding-top: 10px; gap: 2px;
    }
    #nav a {
      color: var(--dim); text-decoration: none; font-size: 10px; letter-spacing: 0.12em;
      padding: 12px 0; text-align: center; border-left: 2px solid transparent;
    }
    #nav a .ico { display: block; font-size: 16px; margin-bottom: 3px; }
    #nav a:hover { color: var(--ink); }
    #nav a.active { color: var(--accent); border-left-color: var(--accent); background: #12151c; }
    #main { flex: 1; overflow-y: auto; padding: 20px 26px; }
    h1 { font-size: 14px; color: var(--accent); letter-spacing: 0.08em; }
    .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
    #filters { display: flex; gap: 6px; margin-bottom: 16px; }
    .chip {
      background: none; border: 1px solid var(--line); color: var(--dim);
      font: inherit; font-size: 11px; padding: 3px 12px; cursor: pointer; border-radius: 12px;
    }
    .chip.active { color: #0b0c10; background: var(--accent); border-color: var(--accent); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center;
    }
    .card canvas { width: 128px; height: 128px; image-rendering: pixelated; background: #0c0d12; border-radius: 4px; }
    .card .name { font-size: 11px; color: var(--ink); text-align: center; word-break: break-all; }
    .card .kind { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; }
    .kind.hero { color: var(--accent); }
    .kind.beast { color: #c98a4e; }
    .kind.legacy { color: var(--dim); }
    .card .actions { display: flex; gap: 6px; }
    .card button {
      background: none; border: 1px solid var(--line); color: var(--dim);
      font: inherit; font-size: 10px; padding: 2px 10px; cursor: pointer; border-radius: 3px;
    }
    .card button:hover { color: var(--accent); border-color: var(--accent); }
    .card button.del:hover { color: var(--warn); border-color: var(--warn); }
    #empty { color: var(--dim); }
  </style>
</head>
<body>
  <nav id="nav">
    <a href="/"><span class="ico">⚒</span>FORGE</a>
    <a class="active" href="/bestiary.html"><span class="ico">🐾</span>BESTIARY</a>
    <a href="/clash.html"><span class="ico">✦</span>ARENA</a>
    <a href="/void.html"><span class="ico">◌</span>VOID</a>
    <a href="/grid.html"><span class="ico">◇</span>RIG</a>
  </nav>
  <div id="main">
    <h1>BESTIARY</h1>
    <div class="sub">every saved character, alive on the shelf — click open to work on one</div>
    <div id="filters"></div>
    <div id="grid"></div>
    <div id="empty" hidden>nothing on the shelf yet — hatch something in the forge and save it</div>
  </div>
  <script type="module" src="/src/bestiary.ts"></script>
</body>
</html>
