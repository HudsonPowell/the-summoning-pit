<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rig — forge</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #14161c;
      --line: #23252e;
      --ink: #c8cdd6;
      --dim: #6b7280;
      --accent: #3aa7a0;
      --warn: #d5573b;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.5 'SF Mono', ui-monospace, Menlo, monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* --- nav rail --- */
    #nav {
      width: 74px; background: #0d0f14; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: stretch; padding-top: 10px; gap: 2px;
    }
    #nav a {
      color: var(--dim); text-decoration: none; font-size: 10px; letter-spacing: 0.12em;
      padding: 12px 0; text-align: center; border-left: 2px solid transparent;
    }
    #nav a .ico { display: block; font-size: 16px; margin-bottom: 3px; }
    #nav a:hover { color: var(--ink); }
    #nav a.active { color: var(--accent); border-left-color: var(--accent); background: #12151c; }
    /* --- stage --- */
    #stage {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; min-width: 0;
    }
    #behaviors { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .chip {
      background: none; border: 1px solid var(--line); color: var(--dim);
      font: inherit; font-size: 11px; padding: 3px 12px; cursor: pointer; border-radius: 12px;
    }
    .chip:hover { color: var(--ink); border-color: var(--dim); }
    .chip.active { color: #0b0c10; background: var(--accent); border-color: var(--accent); }
    #view {
      width: min(74vh, 52vw); height: min(74vh, 52vw);
      image-rendering: pixelated; border: 1px solid var(--line); background: #0c0d12;
      cursor: grab; touch-action: none;
    }
    #view:active { cursor: grabbing; }
    #readouts { display: flex; gap: 18px; color: var(--dim); }
    #readouts b { color: var(--accent); font-weight: 500; }
    /* --- panel --- */
    #panel {
      width: 330px; overflow-y: auto; background: var(--panel);
      border-left: 1px solid var(--line); padding: 14px 16px 40px;
    }
    #panel h1 { font-size: 14px; color: var(--accent); font-weight: 600; letter-spacing: 0.08em; }
    #panel .sub { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
    #header { display: flex; align-items: flex-start; justify-content: space-between; }
    #play {
      background: var(--accent); color: #0b0c10; text-decoration: none;
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      padding: 6px 14px; border-radius: 4px;
    }
    #play:hover { filter: brightness(1.15); }
    .group { margin-top: 14px; }
    .group h2 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--dim); font-weight: 600; margin-bottom: 6px;
      border-bottom: 1px solid var(--line); padding-bottom: 4px;
    }
    .row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; padding: 2px 0; }
    .row span { color: var(--ink); font-size: 11px; }
    .row em { color: var(--dim); font-style: normal; font-size: 11px; text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
    input[type=checkbox] { accent-color: var(--accent); }
    input[type=color] {
      width: 100%; height: 18px; border: 1px solid #2c2f3a; border-radius: 3px;
      background: none; padding: 0; cursor: pointer;
    }
    input[type=text] {
      background: #0b0c10; color: var(--ink); border: 1px solid #2c2f3a;
      font: inherit; font-size: 11px; padding: 4px 8px; border-radius: 3px; width: 100%;
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    select {
      background: #0b0c10; color: var(--ink); border: 1px solid #2c2f3a;
      font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 3px; width: 100%;
    }
    .act {
      background: none; border: 1px solid var(--accent); color: var(--accent);
      font: inherit; font-size: 11px; padding: 3px 14px; cursor: pointer;
      border-radius: 3px; margin: 4px 6px 4px 0; white-space: nowrap;
    }
    .act:hover { background: var(--accent); color: #0b0c10; }
    .act:disabled { opacity: 0.4; cursor: default; }
    .inline { display: flex; gap: 6px; align-items: center; }
    .status { color: var(--dim); font-size: 11px; min-height: 16px; margin-top: 4px; }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--warn); }
    #genome {
      width: 100%; height: 130px; margin-top: 6px;
      background: #0b0c10; color: #8a94a3; border: 1px solid var(--line);
      font: 10px/1.4 ui-monospace, monospace; padding: 6px; resize: vertical;
    }
    #genomebar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    #bytes { color: var(--dim); font-size: 11px; }
    #copy, #apply {
      background: none; border: 1px solid #2c2f3a; color: var(--ink);
      font: inherit; font-size: 11px; padding: 2px 10px; cursor: pointer; border-radius: 3px;
    }
    #copy:hover, #apply:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <nav id="nav">
    <a class="active" href="/"><span class="ico">⚒</span>FORGE</a>
    <a href="/bestiary.html"><span class="ico">🐾</span>BESTIARY</a>
    <a href="/clash.html"><span class="ico">✦</span>ARENA</a>
    <a href="/void.html"><span class="ico">◌</span>VOID</a>
    <a href="/grid.html"><span class="ico">◇</span>RIG</a>
  </nav>
  <div id="stage">
    <div id="behaviors"></div>
    <canvas id="view" width="704" height="704"></canvas>
    <div id="readouts">
      <div>speed <b id="speed">—</b></div>
      <div><b id="fps">—</b></div>
    </div>
  </div>
  <div id="panel">
    <div id="header">
      <div>
        <h1>FORGE</h1>
        <div class="sub">one character, moving, changeable while it moves</div>
      </div>
      <a id="play" href="/clash.html">play &nbsp;▶</a>
    </div>

    <div class="group">
      <h2>identity</h2>
      <div class="inline">
        <input id="charname" type="text" placeholder="name" spellcheck="false" />
        <select id="charkind" style="width:86px">
          <option value="hero">hero</option>
          <option value="beast">beast</option>
        </select>
      </div>
      <div class="inline" style="margin-top:6px">
        <button id="savebtn" class="act">save</button>
        <span id="savestatus" class="status" style="margin-top:0"></span>
      </div>
    </div>

    <div class="group">
      <h2>hatch — describe a creature</h2>
      <div class="inline">
        <input id="hatchdesc" type="text" placeholder="a tiny frantic bat-winged gremlin" spellcheck="false" />
        <button id="hatchbtn" class="act">hatch</button>
        <button id="rerollbtn" class="act" hidden title="same words, new dice">reroll</button>
      </div>
      <div id="hatchstatus" class="status"></div>
    </div>

    <div class="group">
      <h2>weapon — say the word</h2>
      <div class="inline">
        <input id="weapondesc" type="text" placeholder="a crooked bone staff" spellcheck="false" />
        <button id="forgebtn" class="act">forge</button>
        <button id="unarmbtn" class="act" title="drop the weapon">drop</button>
      </div>
      <div id="weaponstatus" class="status"></div>
    </div>

    <div class="group" id="gBlast">
      <h2>blast — the look of the cross</h2>
    </div>

    <div class="group">
      <h2>character file</h2>
      <textarea id="genome" spellcheck="false"></textarea>
      <div id="genomebar">
        <span id="bytes"></span>
        <span>
          <button id="apply">apply</button>
          <button id="copy">copy</button>
        </span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
