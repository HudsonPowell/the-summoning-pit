<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rig — studio</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #14161c;
      --ink: #c8cdd6;
      --dim: #6b7280;
      --accent: #3aa7a0;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.5 'SF Mono', ui-monospace, Menlo, monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
    }
    #view {
      width: min(82vh, 60vw);
      height: min(82vh, 60vw);
      image-rendering: pixelated;
      border: 1px solid #23252e;
      background: #0c0d12;
    }
    #readouts { display: flex; gap: 18px; color: var(--dim); }
    #readouts b { color: var(--accent); font-weight: 500; }
    #panel {
      width: 320px;
      overflow-y: auto;
      background: var(--panel);
      border-left: 1px solid #23252e;
      padding: 14px 16px 40px;
    }
    #panel h1 { font-size: 14px; color: var(--accent); font-weight: 600; letter-spacing: 0.08em; }
    #panel .sub { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
    .group { margin-top: 14px; }
    .group h2 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--dim); font-weight: 600; margin-bottom: 6px;
      border-bottom: 1px solid #23252e; padding-bottom: 4px;
    }
    .row { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; padding: 2px 0; }
    .row span { color: var(--ink); font-size: 11px; }
    .row em { color: var(--dim); font-style: normal; font-size: 11px; text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
    #genome {
      width: 100%; height: 150px; margin-top: 6px;
      background: #0b0c10; color: #8a94a3; border: 1px solid #23252e;
      font: 10px/1.4 ui-monospace, monospace; padding: 6px; resize: vertical;
    }
    #genomebar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    #bytes { color: var(--dim); font-size: 11px; }
    #copy, #apply {
      background: none; border: 1px solid #2c2f3a; color: var(--ink);
      font: inherit; font-size: 11px; padding: 2px 10px; cursor: pointer; border-radius: 3px;
    }
    #copy:hover, #apply:hover { border-color: var(--accent); color: var(--accent); }
    select {
      background: #0b0c10; color: var(--ink); border: 1px solid #2c2f3a;
      font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 3px; width: 100%;
    }
    input[type=color] {
      width: 100%; height: 18px; border: 1px solid #2c2f3a; border-radius: 3px;
      background: none; padding: 0; cursor: pointer;
    }
    #view { cursor: grab; touch-action: none; }
    #view:active { cursor: grabbing; }
    #header { display: flex; align-items: flex-start; justify-content: space-between; }
    #play {
      background: var(--accent); color: #0b0c10; text-decoration: none;
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      padding: 6px 14px; border-radius: 4px;
    }
    #play:hover { filter: brightness(1.15); }
    #hatchrow { display: flex; gap: 6px; }
    #hatchrow input[type=text] {
      flex: 1; background: #0b0c10; color: var(--ink); border: 1px solid #2c2f3a;
      font: inherit; font-size: 11px; padding: 4px 8px; border-radius: 3px;
    }
    #hatchrow input[type=text]:focus { outline: none; border-color: var(--accent); }
    #hatchstatus { color: var(--dim); font-size: 11px; min-height: 16px; margin-top: 4px; }
    #hatchstatus.ok { color: var(--accent); }
    #hatchstatus.err { color: #d5573b; }
    .act {
      background: none; border: 1px solid var(--accent); color: var(--accent);
      font: inherit; font-size: 11px; padding: 3px 14px; cursor: pointer;
      border-radius: 3px; margin: 4px 6px 4px 0;
    }
    .act:hover { background: var(--accent); color: #0b0c10; }
    input[type=checkbox] { accent-color: var(--accent); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="view" width="704" height="704"></canvas>
    <div id="readouts">
      <div>speed <b id="speed">—</b></div>
      <div><b id="fps">—</b></div>
    </div>
  </div>
  <div id="panel">
    <div id="header">
      <div>
        <h1>RIG</h1>
        <div class="sub">one creature, moving, changeable while it moves</div>
      </div>
      <a id="play" href="/grid.html">play &nbsp;▶</a>
    </div>
    <div class="group">
      <h2>hatch — describe a creature</h2>
      <div id="hatchrow">
        <input id="hatchdesc" type="text" placeholder="a tiny frantic bat-winged gremlin"
               spellcheck="false" />
        <button id="hatchbtn" class="act">hatch</button>
        <button id="rerollbtn" class="act" hidden title="same words, new dice — replaces the last hatch">reroll</button>
      </div>
      <div id="hatchstatus"></div>
    </div>
    <div class="group">
      <h2>genome — the whole creature</h2>
      <textarea id="genome" spellcheck="false"></textarea>
      <div id="genomebar">
        <span id="bytes"></span>
        <span>
          <button id="apply">apply</button>
          <button id="copy">copy</button>
        </span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
