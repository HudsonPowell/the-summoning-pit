<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rig — arena</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      background: #0b0c10; color: #6b7280;
      font: 12px/1.5 'SF Mono', ui-monospace, Menlo, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 10px;
    }
    #view {
      width: min(120vh, 92vw);
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      border: 1px solid #23252e;
    }
    #hud b { color: #3aa7a0; }
    a { color: #3aa7a0; text-decoration: none; }
    #controls { display: flex; gap: 18px; align-items: center; }
    #controls label { display: flex; gap: 6px; align-items: center; }
    input[type=range] { width: 110px; accent-color: #3aa7a0; }
  </style>
</head>
<body>
  <canvas id="view" width="960" height="720"></canvas>
  <div id="hud"></div>
  <div id="controls">
    <label>zoom <input id="zoom" type="range" min="14" max="64" step="1" value="26" /></label>
    <label>resolution <input id="res" type="range" min="160" max="512" step="16" value="240" /></label>
    <a href="/">← studio</a>
  </div>
  <script type="module" src="/src/arena.ts"></script>
</body>
</html>
