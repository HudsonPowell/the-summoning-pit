<!doctype html><html><head><meta charset="utf-8">
<title>One Becomes Many</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<style>
  /* One colour. One rule weight. One box. One face, at one size.
     The page is black; everything drawn on it is white. */
  :root { --ink: #ffffff; --page: #000000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); }
  body { padding: 0; }
  svg { display: block; width: 100%; height: auto; }
  text {
    font-family: Michroma, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13px;
    letter-spacing: .2em;
    fill: var(--ink);
    text-transform: uppercase;
  }
  .r { stroke: var(--ink); stroke-width: 1; fill: none; }
</style>

<svg viewBox="0 0 1400 1620" role="img"
     aria-label="The Summoning Pit, signal path: one sentence becomes two composed bodies, one is kept, priced, simulated, and broadcast to every screen.">

  <!-- the plate -->
  <rect class="r" x="60" y="60" width="1280" height="1500"/>

  <text x="120" y="150">THE SUMMONING PIT</text>
  <text x="1280" y="150" text-anchor="end">SIGNAL PATH</text>

  <!-- ============================================================
       The shape of the drawing IS the shape of the system:
       one, divided in two, rejoined, held to a single column,
       and finally given to everybody.
       ============================================================ -->

  <!-- 1 · the sentence -->
  <rect class="r" x="530" y="300" width="340" height="84"/>
  <text x="920" y="348">A SENTENCE</text>

  <line class="r" x1="700" y1="384" x2="700" y2="412"/>
  <line class="r" x1="615" y1="412" x2="785" y2="412"/>
  <line class="r" x1="615" y1="412" x2="615" y2="440"/>
  <line class="r" x1="785" y1="412" x2="785" y2="440"/>

  <!-- 2 · two bodies, composed in parallel, occupying one box's width -->
  <rect class="r" x="530" y="440" width="160" height="84"/>
  <rect class="r" x="710" y="440" width="160" height="84"/>
  <text x="920" y="488">TWO BODIES COMPOSED</text>

  <line class="r" x1="615" y1="524" x2="615" y2="552"/>
  <line class="r" x1="785" y1="524" x2="785" y2="552"/>
  <line class="r" x1="615" y1="552" x2="785" y2="552"/>
  <line class="r" x1="700" y1="552" x2="700" y2="580"/>

  <!-- 3 · one kept -->
  <rect class="r" x="530" y="580" width="340" height="84"/>
  <text x="920" y="628">ONE KEPT</text>

  <line class="r" x1="700" y1="664" x2="700" y2="720"/>

  <!-- 4 · priced -->
  <rect class="r" x="530" y="720" width="340" height="84"/>
  <text x="920" y="768">PRICED</text>

  <line class="r" x1="700" y1="804" x2="700" y2="860"/>

  <!-- 5 · the pit -->
  <rect class="r" x="530" y="860" width="340" height="84"/>
  <text x="920" y="908">ONE WORLD</text>

  <line class="r" x1="700" y1="944" x2="700" y2="1000"/>
  <line class="r" x1="552" y1="1000" x2="848" y2="1000"/>
  <line class="r" x1="552" y1="1000" x2="552" y2="1028"/>
  <line class="r" x1="626" y1="1000" x2="626" y2="1028"/>
  <line class="r" x1="700" y1="1000" x2="700" y2="1028"/>
  <line class="r" x1="774" y1="1000" x2="774" y2="1028"/>
  <line class="r" x1="848" y1="1000" x2="848" y2="1028"/>

  <!-- 6 · every screen — the same 340 across, divided again -->
  <rect class="r" x="530" y="1028" width="44" height="44"/>
  <rect class="r" x="604" y="1028" width="44" height="44"/>
  <rect class="r" x="678" y="1028" width="44" height="44"/>
  <rect class="r" x="752" y="1028" width="44" height="44"/>
  <rect class="r" x="826" y="1028" width="44" height="44"/>
  <text x="920" y="1058">EVERY WATCHER</text>

  <!-- The only numbers the drawing carries. Two columns, because three
       put a value on a row it did not belong to, and a plate that misreads
       is worse than a plate that says less. -->
  <line class="r" x1="120" y1="1180" x2="1280" y2="1180"/>

  <text x="120" y="1240">200 CHARS</text>
  <text x="520" y="1240">THE SENTENCE, KEPT NOWHERE</text>

  <text x="120" y="1280">TWO</text>
  <text x="520" y="1280">BODIES COMPOSED FROM IT</text>

  <text x="120" y="1320">NINE SECONDS</text>
  <text x="520" y="1320">THE JUDGE'S WHOLE LIFE</text>

  <text x="120" y="1360">0.012 · 3.2 · 36 · 0.17</text>
  <text x="520" y="1360">THE FOUR CEILINGS A BODY MEETS</text>

  <text x="120" y="1400">30 HZ</text>
  <text x="520" y="1400">THE WORLD ADVANCES</text>

  <text x="120" y="1440">15 HZ</text>
  <text x="520" y="1440">THE WORLD IS SENT</text>

  <text x="120" y="1480">0.45</text>
  <text x="520" y="1480">OF A GAP BEHIND, IS WHERE YOU WATCH</text>

</svg>
</head></html>
