<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<title>Pit Signal Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --paper:  #e7e2d6;   /* the plate stock */
    --tint:   #cfd6d9;   /* flat box fill, the blue-grey of a printed schematic */
    --tint2:  #d9d2c0;   /* second fill, for the engine's own boxes */
    --line:   #17150f;   /* hairline */
    --soft:   #6b665a;   /* secondary rule + annotation */
    --gold:   #7a5a12;   /* the authoritative path */
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]) {}
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0a0a0c; --tint: #1b2026; --tint2: #201d16;
      --line: #cfc9ba; --soft: #7d7869; --gold: #b8975a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0a0a0c; --tint: #1b2026; --tint2: #201d16;
    --line: #cfc9ba; --soft: #7d7869; --gold: #b8975a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { padding: 26px; }
  .plate { width: 100%; max-width: 1700px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }

  /* every mark on the plate is a hairline; nothing is rounded, nothing glows */
  .bx   { fill: var(--tint);  stroke: var(--line); stroke-width: 1; }
  .bx2  { fill: var(--tint2); stroke: var(--line); stroke-width: 1; }
  .open { fill: none;         stroke: var(--line); stroke-width: 1; }
  .rule { stroke: var(--line); stroke-width: 1; fill: none; }
  .thin { stroke: var(--soft); stroke-width: .7; fill: none; }
  .dash { stroke: var(--soft); stroke-width: .7; fill: none; stroke-dasharray: 3 3; }
  .auth { stroke: var(--gold); stroke-width: 1.4; fill: none; }
  .frame{ fill: none; stroke: var(--line); stroke-width: 1.2; }

  text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; fill: var(--line); }
  .cap  { font-size: 9px; letter-spacing: .14em; fill: var(--soft); }   /* label ABOVE a box */
  .in   { font-size: 10.5px; }                                          /* contents of a box */
  .sm   { font-size: 8.6px; fill: var(--soft); }                        /* annotation */
  .num  { font-size: 10px; fill: var(--gold); font-weight: 500; }
  .ttl  { font-size: 13px; letter-spacing: .3em; }
  .plateno { font-size: 26px; font-weight: 600; letter-spacing: .04em; }
  .reg  { font-size: 9px; letter-spacing: .22em; fill: var(--soft); }
</style>

  <text class="sm" x="330" y="1482">k = 14 px · SHAPE 1.0</text>
  <text class="sm" x="330" y="1498">ONE MASS · THE PIT'S LOOK</text>
  <text class="sm" x="330" y="1514">k IS PIXELS — IT MUST</text>
  <text class="sm" x="330" y="1530">FOLLOW THE ZOOM</text>

  <!-- the maths, set like the crossover values -->
  <rect class="open" x="640" y="1132" width="500" height="460"/>
  <text class="sm" x="654" y="1154">PER PIXEL · NO RAY IS MARCHED · NO POLYGON EXISTS</text>
  <line class="thin" x1="654" y1="1166" x2="1126" y2="1166"/>

  <text class="sm" x="654" y="1194">1 · PROJECT</text>
  <text class="in" x="654" y="1214">a, b → SCREEN px + DEPTH, r → px</text>
  <text class="sm" x="654" y="1230">CAPSULES ARE PROJECTED ONCE, ON THE CPU</text>

  <text class="sm" x="654" y="1262">2 · SIGNED DISTANCE, IN 2D</text>
  <text class="num" x="654" y="1284">s = |P − seg(a,b)| − r</text>
  <text class="sm" x="654" y="1300">SOLVED, NOT STEPPED · s &lt; 0 IS INSIDE</text>

  <text class="sm" x="654" y="1332">3 · DEPTH FROM THE BULGE</text>
  <text class="num" x="654" y="1354">z = lerp(az,bz,t) + √(r²−d²) / ppm</text>
  <text class="sm" x="654" y="1370">THE SURFACE, NOT THE AXIS — UP TO A FULL RADIUS</text>

  <text class="sm" x="654" y="1402">4 · SMOOTH MINIMUM</text>
  <text class="num" x="654" y="1424">w = exp(−(s − s_min) / k)</text>
  <text class="num" x="654" y="1444">s_soft = s_min − k · ln Σw</text>
  <text class="num" x="654" y="1464">s = s_min + (s_soft − s_min) · shape</text>
  <text class="sm" x="654" y="1480">ONLY PARTS WITHIN 0.35 m OF DEPTH MAY FUSE</text>

  <text class="sm" x="654" y="1512">5 · CROSS-SECTION AND SHADE</text>
  <text class="num" x="654" y="1534">q = clamp(1 + s / max(0.5, r), 0, 1)</text>
  <text class="num" x="654" y="1554">shade = 0.5 + 0.5·√(1 − q²) → 4 LEVELS</text>

  <!-- two loop orders, one field -->
  <rect class="open" x="1180" y="1132" width="502" height="460"/>
  <text class="sm" x="1194" y="1154">THE SAME FIELD, TWO LOOP ORDERS</text>
  <line class="thin" x1="1194" y1="1166" x2="1668" y2="1166"/>

  <rect class="bx" x="1194" y="1182" width="220" height="104"/>
  <text class="in" x="1204" y="1204">GPU · WGSL</text>
  <text class="sm" x="1204" y="1222">FULLSCREEN TRIANGLE</text>
  <text class="sm" x="1204" y="1238">FRAGMENT SHADER</text>
  <text class="sm" x="1204" y="1254">FOR EACH PIXEL:</text>
  <text class="sm" x="1204" y="1270">  OVER ALL CAPSULES</text>

  <rect class="open" x="1440" y="1182" width="228" height="104"/>
  <text class="in" x="1450" y="1204">CPU · REFERENCE</text>
  <text class="sm" x="1450" y="1222">TWO SWEEPS</text>
  <text class="sm" x="1450" y="1238">FOR EACH CAPSULE:</text>
  <text class="sm" x="1450" y="1254">  OVER ITS BOUNDING BOX</text>
  <text class="sm" x="1450" y="1270">  PADDED BY k × 6</text>
  <path class="thin" d="M1414,1234 L1440,1234"/>
  <text class="sm" x="1194" y="1308">INVERTED FOR CACHE ORDER · IDENTICAL OUTPUT · CALLERS NEVER CARE WHICH</text>

  <text class="sm" x="1194" y="1348">SWEEP 1 — CLAIM THE PIXEL</text>
  <text class="sm" x="1194" y="1366">TRUE MINIMUM s IS KEPT FOR THE SMOOTH-MIN, BUT THE PIXEL</text>
  <text class="sm" x="1194" y="1382">BELONGS TO WHAT IS IN FRONT: INSIDE BEATS OUTSIDE, THEN</text>
  <text class="sm" x="1194" y="1398">GREATER z WINS. SORTING BY DEPTH OF PENETRATION LETS A</text>
  <text class="sm" x="1194" y="1414">FAT FAR LIMB PAINT OVER A THIN NEAR ONE.</text>

  <text class="sm" x="1194" y="1446">SWEEP 2 — ACCUMULATE</text>
